            --chart-3: #C56A75;
            --chart-4: #9F7BC4;
            --chart-5: #FFD98C;
            --sidebar: #2A2D20;
            --sidebar-foreground: #F4EAD5;
            --sidebar-primary: #7CB374;
            --sidebar-primary-foreground: #1F2218;
            --sidebar-accent: #E89098;
            --sidebar-accent-foreground: #1A1410;
            --sidebar-border: #4A4D3A;
            --sidebar-ring: #C56A75;
