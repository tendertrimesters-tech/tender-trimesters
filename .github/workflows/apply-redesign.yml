name: Apply Warm Modernist Redesign v2

# TENDER TRIMESTERS — Warm Modernist Redesign Applier (One-Click)
# HOW TO USE:
# STEP 1: Upload this file to .github/workflows/apply-redesign.yml in your repo
# STEP 2: Go to Actions tab → click "Apply Warm Modernist Redesign v2" → "Run workflow"
# STEP 3: Wait ~60s, then check Vercel Deployments for the redesign/v2 preview URL
# STEP 4: When happy, merge the auto-created Pull Request to deploy to production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create redesign/v2 branch from main
        run: |
          git checkout main
          git pull origin main --no-edit || true
          git branch -D redesign/v2 2>/dev/null || true
          git push origin :redesign/v2 2>/dev/null || true
          git checkout -b redesign/v2
          mkdir -p src/app
          mkdir -p src/components/app/screens
          mkdir -p src/components/landing

      - name: Write src/app/globals.css
        run: |
          cat > src/app/globals.css << 'TENDERTRIMESTERS_FILE_EOF'
